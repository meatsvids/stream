<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"

        content="width=device-width, initial-scale=1">

  <title>Live TV Test</title>

 

  <style>

    body {

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

      padding: 15px;

    }

    video {

      width: 100%;

      aspect-ratio: 16/9;

      background: black;

    }

    #status {

      padding: 12px;

      background: #222;

      border-radius: 6px;

      overflow-wrap: anywhere;

    }

  </style>

</head>

 

<body>

  <h2>Live TV Test</h2>

 

  <video id="video"

         controls

         playsinline

         preload="auto"

         x-webkit-airplay="allow">

  </video>

 

  <p id="status">Starting player...</p>

  <button id="play">Play Video</button>

 

  <script src=https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js></script>

 

  <script>

    const STREAM_URL =

      https://basement.tail92bf5a.ts.net/mystream/index.m3u8;

 

    const video = document.getElementById("video");

    const status = document.getElementById("status");

 

    function message(text) {

      status.textContent = text;

      console.log(text);

    }

 

    document.getElementById("play")

      .addEventListener("click", async () => {

        try {

          await video.play();

        } catch (err) {

          message("Play failed: " + err.message);

        }

      });

 

    video.addEventListener("playing", () => {

      message("SUCCESS: Video is playing!");

    });

 

    video.addEventListener("waiting", () => {

      message("Waiting for video data...");

    });

 

    video.addEventListener("error", () => {

      message("Video error code: " +

        (video.error ? video.error.code : "unknown"));

    });

 

    if (video.canPlayType(

      "application/vnd.apple.mpegurl"

    )) {

      message("Using native HLS playback");

      video.src = STREAM_URL;

      video.load();

 

    } else if (

      window.Hls &&

      Hls.isSupported()

    ) {

      message("Using HLS.js");

 

      const hls = new Hls();

 

      hls.on(Hls.Events.ERROR, (_, data) => {

        message(

          "HLS error: " + data.details +

          " | Fatal: " + data.fatal

        );

      });

 

      hls.on(Hls.Events.MANIFEST_PARSED, () => {

        message("HLS playlist loaded. Press Play.");

      });

 

      hls.loadSource(STREAM_URL);

      hls.attachMedia(video);

 

    } else {

      message(

        "HLS not supported or HLS.js failed to load"

      );

    }

  </script>

</body>

</html>
