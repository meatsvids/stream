<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,initial-scale=1">

<title>Live TV - Watch and Cast</title>

 

<style>

  body {

    margin: 0;

    padding: 16px;

    background: #101218;

    color: white;

    font-family: Arial, sans-serif;

  }

  .player {

    max-width: 960px;

    margin: auto;

  }

  video {

    display: block;

    width: 100%;

    aspect-ratio: 16/9;

    background: black;

    border-radius: 9px;

  }

  .toolbar {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 12px;

    margin-top: 12px;

  }

  button {

    background: #263653;

    color: white;

    border: 1px solid #506080;

    padding: 12px;

    border-radius: 8px;

    font-size: 15px;

    cursor: pointer;

  }

  google-cast-launcher {

    display: inline-block;

    width: 38px;

    height: 38px;

    --connected-color: #ffffff;

    --disconnected-color: #ffffff;

  }

  #status {

    background: #202735;

    padding: 12px;

    border-radius: 8px;

    font-size: 14px;

    overflow-wrap: anywhere;

  }

  a { color: #a8caff; }

</style>

</head>

 

<body>

<div class="player">

  <h2>Live TV</h2>

 

  <video id="video"

    controls

    playsinline

    x-webkit-airplay="allow"

    preload="none">

  </video>

 

  <div class="toolbar">

    <button id="play">Play Live</button>

    <button id="airplay" hidden>AirPlay</button>

 

    <google-cast-launcher>

    </google-cast-launcher>

 

    <button id="fullscreen">Fullscreen</button>

  </div>

 

  <p id="status">Initializing player...</p>

 

  <p>

    Having trouble casting?

    <a id="directLink" target="_blank"

       rel="noopener">Open original player</a>

  </p>

</div>

 

<script>
(function () {
  "use strict";

  const STREAM_URL = "https://basement.tail92bf5a.ts.net/mystream/index.m3u8";
  const video = document.getElementById("video");
  const status = document.getElementById("status");
  const playButton = document.getElementById("play");
  const airplay = document.getElementById("airplay");
  const RETRY_DELAY_MS = 3000;
  const STARTUP_TIMEOUT_MS = 20000;
  const MAX_STARTUP_RETRIES = 5;

  let hls = null;
  let retryTimer = null;
  let startupTimer = null;
  let attempt = 0;
  let retries = 0;
  let ready = false;
  let nativeHls = false;
  let everPlayed = false;

  document.getElementById("directLink").href =
    STREAM_URL.replace(/\/index\.m3u8(?:[?#].*)?$/, "/");

  function report(message) {
    status.textContent = message;
    console.log("[Live TV]", message);
  }
  window.reportCastError = report;

  // Chrome HLS.js: don't allow video.play() or native media controls
  // before the browser has enough video data to start playing.
  function setReady(isReady) {
    ready = isReady;
    if (nativeHls) return;
    playButton.disabled = !isReady;
    playButton.textContent = isReady ? "Play Live" : "Preparing Live TV...";
    video.controls = isReady;
    video.style.pointerEvents = isReady ? "auto" : "none";
  }

  function clearStartupTimer() {
    if (startupTimer !== null) {
      clearTimeout(startupTimer);
      startupTimer = null;
    }
  }

  function safelyPlay() {
    if (!ready && !nativeHls) {
      report("Preparing live video. Please wait...");
      return;
    }
    const result = video.play();
    if (result && typeof result.catch === "function") {
      result.catch(function (error) {
        // Some aborted play promises happen during a stream reset.
        if (!ready && !nativeHls) return;
        report("Playback error: " + error.message);
      });
    }
  }

  playButton.addEventListener("click", function () {
    if (!ready && !nativeHls) return;
    safelyPlay();
  });

  document.getElementById("fullscreen").addEventListener("click", function () {
    if (typeof video.webkitEnterFullscreen === "function") {
      video.webkitEnterFullscreen();
    } else if (video.requestFullscreen) {
      video.requestFullscreen().catch(function (error) {
        report("Fullscreen unavailable: " + error.message);
      });
    }
  });

  if (typeof video.webkitShowPlaybackTargetPicker === "function") {
    airplay.hidden = false;
    airplay.addEventListener("click", function () {
      video.webkitShowPlaybackTargetPicker();
    });
  }

  video.addEventListener("playing", function () {
    everPlayed = true;
    retries = 0;
    clearStartupTimer();
    report("LIVE - Video playing");
  });

  video.addEventListener("waiting", function () {
    if (ready || nativeHls) report("Buffering live video...");
  });

  video.addEventListener("error", function () {
    const reason = video.error ? video.error.message : "Unknown media error";
    if (!nativeHls && !ready && retryTimer === null) {
      scheduleRetry("Browser decoder: " + reason);
    } else if (ready || nativeHls) {
      report("Video error: " + reason);
    }
  });

  function resetMedia() {
    clearStartupTimer();
    // Invalidate callbacks from an older HLS instance.
    attempt++;
    if (hls) {
      const old = hls;
      hls = null;
      old.destroy();
    }
    video.pause();
    video.removeAttribute("src");
    video.load();
  }

  function scheduleRetry(reason) {
    if (ready || retryTimer !== null) return;
    resetMedia();
    setReady(false);
    if (retries >= MAX_STARTUP_RETRIES) {
      report("Unable to prepare video after " + MAX_STARTUP_RETRIES +
        " retries. Use Retry Connection below, or open the original player. Last error: " + reason);
      playButton.disabled = false;
      playButton.textContent = "Retry Connection";
      playButton.onclick = function () {
        playButton.onclick = null;
        retries = 0;
        beginHlsAttempt();
      };
      return;
    }
    retries++;
    report("Stream not ready (" + reason + "). Retrying " +
      retries + "/" + MAX_STARTUP_RETRIES + " in 3 seconds...");
    retryTimer = setTimeout(function () {
      retryTimer = null;
      beginHlsAttempt();
    }, RETRY_DELAY_MS);
  }

  function beginHlsAttempt() {
    if (retryTimer !== null) {
      clearTimeout(retryTimer);
      retryTimer = null;
    }
    resetMedia();
    setReady(false);
    report("Preparing live stream" + (retries ? " (attempt " + (retries + 1) + ")" : "") + "...");
    const currentAttempt = attempt;
    const instance = new Hls();
    hls = instance;

    startupTimer = setTimeout(function () {
      if (currentAttempt === attempt && !ready) {
        scheduleRetry("startup timed out");
      }
    }, STARTUP_TIMEOUT_MS);

    instance.on(Hls.Events.MEDIA_ATTACHED, function () {
      if (currentAttempt === attempt) instance.loadSource(STREAM_URL);
    });

    instance.on(Hls.Events.MANIFEST_PARSED, function () {
      if (currentAttempt === attempt && !ready) {
        report("Playlist loaded. Buffering video; please wait...");
      }
    });

    // MANIFEST_PARSED isn't enough: the first media bytes must be decoded.
    instance.on(Hls.Events.ERROR, function (_event, data) {
      if (currentAttempt !== attempt) return;
      console.warn("[Live TV] HLS error", data);
      if (data.fatal && !ready) {
        scheduleRetry(data.details || "HLS startup failure");
      } else if (data.fatal && ready) {
        report("HLS playback error: " + (data.details || "Unknown"));
      }
    });
    instance.attachMedia(video);
  }

  video.addEventListener("canplay", function () {
    if (nativeHls || ready || retryTimer !== null) return;
    clearStartupTimer();
    retries = 0;
    setReady(true);
    report("Live video ready. Press Play Live.");
  });

  function loadHlsJs() {
    setReady(false);
    report("Loading HLS.js...");
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
    script.onload = function () {
      if (!window.Hls || !Hls.isSupported()) {
        report("HLS.js unavailable or unsupported");
        return;
      }
      beginHlsAttempt();
    };
    script.onerror = function () {
      report("Could not load HLS.js library");
    };
    document.head.appendChild(script);
  }

  // Retain Safari's native HLS handling, including user-gesture playback.
  nativeHls = Boolean(video.canPlayType("application/vnd.apple.mpegurl"));
  if (nativeHls) {
    video.src = STREAM_URL;
    video.load();
    report("Native HLS ready. Press Play Live.");
  } else {
    loadHlsJs();
  }

  window.liveCastURL = STREAM_URL;
})();
</script>

 

<script>

// This callback must exist before the Cast SDK loads.

window.__onGCastApiAvailable = function(available) {

  if (!available) {

    console.log("Google Cast SDK unavailable");

    return;

  }

 

  const context = cast.framework.CastContext.getInstance();

 

  context.setOptions({

    receiverApplicationId:

      chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,

    autoJoinPolicy:

      chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED

  });

 

  async function startCasting() {

    const session = context.getCurrentSession();

    if (!session) return;

 

    const media = new chrome.cast.media.MediaInfo(

      window.liveCastURL,

      "application/x-mpegURL"

    );

 

    media.streamType =

      chrome.cast.media.StreamType.LIVE;

 

    const request =

      new chrome.cast.media.LoadRequest(media);

 

    try {

      await session.loadMedia(request);

      document.getElementById("video").pause();

      window.reportCastError(

        "Live stream sent to Chromecast"

      );

    } catch (error) {

      window.reportCastError(

        "Cast playback failed: " + String(error)

      );

    }

  }

 

  context.addEventListener(

    cast.framework.CastContextEventType.SESSION_STATE_CHANGED,

    function(event) {

      if (event.sessionState ===

          cast.framework.SessionState.SESSION_STARTED) {

        startCasting();

      }

    }

  );

};

</script>

 

<script async
  src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1">
</script>

</body>

</html>
