<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,initial-scale=1">

<title>Live TV - Watch and Cast</title>

 

<style>

  body {

    margin: 0;

    padding: 16px;

    background: #101218;

    color: white;

    font-family: Arial, sans-serif;

  }

  .player {

    max-width: 960px;

    margin: auto;

  }

  video {

    display: block;

    width: 100%;

    aspect-ratio: 16/9;

    background: black;

    border-radius: 9px;

  }

  .toolbar {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 12px;

    margin-top: 12px;

  }

  button {

    background: #263653;

    color: white;

    border: 1px solid #506080;

    padding: 12px;

    border-radius: 8px;

    font-size: 15px;

    cursor: pointer;

  }

  google-cast-launcher {

    display: inline-block;

    width: 38px;

    height: 38px;

    --connected-color: #ffffff;

    --disconnected-color: #ffffff;

  }

  #status {

    background: #202735;

    padding: 12px;

    border-radius: 8px;

    font-size: 14px;

    overflow-wrap: anywhere;

  }

  a { color: #a8caff; }

</style>

</head>

 

<body>

<div class="player">

  <h2>Live TV</h2>

 

  <video id="video"

    controls

    playsinline

    x-webkit-airplay="allow"

    preload="none">

  </video>

 

  <div class="toolbar">

    <button id="play">Play Live</button>

    <button id="airplay" hidden>AirPlay</button>

 

    <google-cast-launcher>

    </google-cast-launcher>

 

    <button id="fullscreen">Fullscreen</button>

  </div>

 

  <p id="status">Initializing player...</p>

 

  <p>

    Having trouble casting?

    <a id="directLink" target="_blank"

       rel="noopener">Open original player</a>

  </p>

</div>

 

<script>
(function () {
  "use strict";

  const STREAM_URL = "https://basement.tail92bf5a.ts.net/mystream/index.m3u8";
  const video = document.getElementById("video");
  const status = document.getElementById("status");
  const airplay = document.getElementById("airplay");
  const MAX_STARTUP_RETRIES = 5;
  const RETRY_DELAY_MS = 2000;

  let hls = null;
  let retryTimer = null;
  let retries = 0;
  let hasPlayed = false;
  let playRequested = false;

  document.getElementById("directLink").href =
    STREAM_URL.replace(/\/index\.m3u8(?:[?#].*)?$/, "/");

  function report(message) {
    status.textContent = message;
    console.log("[Live TV]", message);
  }
  window.reportCastError = report;

  function tryPlay() {
    const result = video.play();
    if (result && typeof result.catch === "function") {
      result.catch(function (error) {
        report("Playback error: " + error.message);
      });
    }
  }

  document.getElementById("play").addEventListener("click", function () {
    playRequested = true;
    if (hls && retries >= MAX_STARTUP_RETRIES && !hasPlayed) {
      retries = 0;
      startHls();
    } else {
      tryPlay();
    }
  });

  document.getElementById("fullscreen").addEventListener("click", function () {
    if (typeof video.webkitEnterFullscreen === "function") {
      video.webkitEnterFullscreen();
    } else if (video.requestFullscreen) {
      video.requestFullscreen().catch(function (error) {
        report("Fullscreen unavailable: " + error.message);
      });
    }
  });

  if (typeof video.webkitShowPlaybackTargetPicker === "function") {
    airplay.hidden = false;
    airplay.addEventListener("click", function () {
      video.webkitShowPlaybackTargetPicker();
    });
  }

  video.addEventListener("playing", function () {
    hasPlayed = true;
    report("LIVE - Video playing");
  });
  video.addEventListener("waiting", function () {
    if (!retryTimer) report("Buffering live video...");
  });
  video.addEventListener("error", function () {
    const reason = video.error ? video.error.message : "Unknown video error";
    if (hls && !hasPlayed) {
      scheduleRetry("Browser decoder: " + reason);
    } else {
      report("Video error: " + reason);
    }
  });

  function scheduleRetry(reason) {
    // Retries are for startup only: a playing stream is not interrupted.
    if (hasPlayed || retryTimer) return;
    if (retries >= MAX_STARTUP_RETRIES) {
      report("Could not start live video after " + MAX_STARTUP_RETRIES +
        " retries. Press Play Live to try again. Last error: " + reason);
      return;
    }
    retries++;
    report("Startup issue (" + reason + "). Retrying " +
      retries + "/" + MAX_STARTUP_RETRIES + " in 2 seconds...");
    retryTimer = setTimeout(function () {
      retryTimer = null;
      startHls();
    }, RETRY_DELAY_MS);
  }

  function startHls() {
    if (hls) {
      hls.destroy();
      hls = null;
    }
    // Clear any failed MediaSource before attaching a fresh HLS.js instance.
    video.removeAttribute("src");
    video.load();

    hls = new Hls(); // Use the same default HLS.js behavior as a basic player.
    const thisHls = hls;

    hls.on(Hls.Events.MEDIA_ATTACHED, function () {
      if (thisHls === hls) thisHls.loadSource(STREAM_URL);
    });
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      if (thisHls !== hls) return;
      report("Live playlist ready. Tap Play.");
      if (playRequested) tryPlay();
    });
    hls.on(Hls.Events.ERROR, function (event, data) {
      if (thisHls !== hls) return;
      console.warn("[Live TV] HLS error", data);
      if (data.fatal) {
        if (!hasPlayed) {
          scheduleRetry(data.details || "HLS startup failed");
        } else {
          report("HLS playback error: " + (data.details || "Unknown"));
        }
      }
    });
    hls.attachMedia(video);
  }

  function loadHlsJs() {
    report("Loading HLS.js...");
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
    script.onload = function () {
      if (!window.Hls || !Hls.isSupported()) {
        report("HLS.js is not supported in this browser");
        return;
      }
      startHls();
    };
    script.onerror = function () {
      report("Unable to download HLS.js library");
    };
    document.head.appendChild(script);
  }

  // Keep native HLS for Safari/iOS; use HLS.js for Chrome/Edge.
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = STREAM_URL;
    video.load();
    report("Native HLS ready. Tap Play.");
  } else {
    loadHlsJs();
  }

  // Read by the existing, separate Google Cast initialization script.
  window.liveCastURL = STREAM_URL;
})();
</script>

 

<script>

// This callback must exist before the Cast SDK loads.

window.__onGCastApiAvailable = function(available) {

  if (!available) {

    console.log("Google Cast SDK unavailable");

    return;

  }

 

  const context = cast.framework.CastContext.getInstance();

 

  context.setOptions({

    receiverApplicationId:

      chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,

    autoJoinPolicy:

      chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED

  });

 

  async function startCasting() {

    const session = context.getCurrentSession();

    if (!session) return;

 

    const media = new chrome.cast.media.MediaInfo(

      window.liveCastURL,

      "application/x-mpegURL"

    );

 

    media.streamType =

      chrome.cast.media.StreamType.LIVE;

 

    const request =

      new chrome.cast.media.LoadRequest(media);

 

    try {

      await session.loadMedia(request);

      document.getElementById("video").pause();

      window.reportCastError(

        "Live stream sent to Chromecast"

      );

    } catch (error) {

      window.reportCastError(

        "Cast playback failed: " + String(error)

      );

    }

  }

 

  context.addEventListener(

    cast.framework.CastContextEventType.SESSION_STATE_CHANGED,

    function(event) {

      if (event.sessionState ===

          cast.framework.SessionState.SESSION_STARTED) {

        startCasting();

      }

    }

  );

};

</script>

 

<script async
  src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1">
</script>

</body>

</html>
