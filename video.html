<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,initial-scale=1">

<title>Meat's Vidst</title>

 

<style>

  body {

    margin: 0;

    padding: 16px;

    background: #101218;

    color: white;

    font-family: Arial, sans-serif;

  }

  .player {

    max-width: 960px;

    margin: auto;

  }

  video {

    display: block;

    width: 100%;

    aspect-ratio: 16/9;

    background: black;

    border-radius: 9px;

  }

  .toolbar {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 12px;

    margin-top: 12px;

  }

  button {

    background: #263653;

    color: white;

    border: 1px solid #506080;

    padding: 12px;

    border-radius: 8px;

    font-size: 15px;

    cursor: pointer;

  }

  google-cast-launcher {

    display: inline-block;

    width: 38px;

    height: 38px;

    --connected-color: #ffffff;

    --disconnected-color: #ffffff;

  }

  #status {

    background: #202735;

    padding: 12px;

    border-radius: 8px;

    font-size: 14px;

    overflow-wrap: anywhere;

  }

  a { color: #a8caff; }

</style>

</head>

 

<body>

<div class="player">

  <h2>Meat's Vids</h2>

 

  <video id="video"

    controls

    playsinline

    x-webkit-airplay="allow"

    preload="none">

  </video>

 

  <div class="toolbar">

    <button id="play" disabled>Connecting Live TV...</button>

    <button id="airplay" hidden>AirPlay</button>

 

    <google-cast-launcher>

    </google-cast-launcher>

 

    <button id="fullscreen">Fullscreen</button>

  </div>

 

  <p id="status">Initializing player...</p>

 

  <p>

    Having trouble casting?

    <a id="directLink" target="_blank"

       rel="noopener">Open original player</a>

  </p>

</div>

 

<script>
(function () {
  "use strict";

  // Use the same HLS library distributed by this MediaMTX server.
  const STREAM_URL = "https://basement.tail92bf5a.ts.net/mystream/index.m3u8";
  const BUNDLED_HLS_JS = "https://basement.tail92bf5a.ts.net/mystream/hls.min.js";
  const FALLBACK_HLS_JS = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
  const video = document.getElementById("video");
  const status = document.getElementById("status");
  const playButton = document.getElementById("play");
  const airplay = document.getElementById("airplay");
  const RETRY_DELAY_MS = 2000;

  let hls = null;
  let retryTimer = null;
  let generation = 0;
  let manifestReady = false;
  let nativeHls = false;
  let isCasting = false;

  window.liveCastURL = STREAM_URL;
  document.getElementById("directLink").href =
    STREAM_URL.replace(/\/index\.m3u8(?:[?#].*)?$/, "/");

  function report(message) {
    status.textContent = message;
    console.log("[Live TV]", message);
  }
  window.reportCastError = report;

  function setPlayEnabled(enabled) {
    playButton.disabled = !enabled;
    playButton.textContent = enabled ? "Play / Unmute" : "Connecting Live TV...";
    // Prevent premature tapping on the native video control during HLS startup.
    if (!nativeHls) {
      video.controls = enabled;
      video.style.pointerEvents = enabled ? "auto" : "none";
    }
  }

  function startPlayback() {
    if (isCasting || (!nativeHls && !manifestReady)) return;
    const p = video.play();
    if (p && typeof p.catch === "function") {
      p.catch(function (err) {
        if (err.name !== "AbortError") {
          report("Ready. Tap Play / Unmute to start: " + err.message);
        }
      });
    }
  }

  playButton.addEventListener("click", function () {
    if (isCasting) {
      report("Video is casting to TV. Disconnect Cast to watch here.");
      return;
    }
    if (!nativeHls && !manifestReady) return;
    video.muted = false;
    startPlayback();
  });

  document.getElementById("fullscreen").addEventListener("click", function () {
    if (typeof video.webkitEnterFullscreen === "function") {
      video.webkitEnterFullscreen();
    } else if (video.requestFullscreen) {
      video.requestFullscreen().catch(function (err) {
        report("Fullscreen unavailable: " + err.message);
      });
    }
  });

  if (typeof video.webkitShowPlaybackTargetPicker === "function") {
    airplay.hidden = false;
    airplay.addEventListener("click", function () {
      video.webkitShowPlaybackTargetPicker();
    });
  }

  // Autoplay muted is intentional: it matches MediaMTX's reliable startup
  // behavior and avoids Chrome's user-gesture autoplay restrictions.
  video.muted = true;
  video.autoplay = true;
  video.playsInline = true;

  video.addEventListener("playing", function () {
    if (!isCasting) report("LIVE - Video playing" + (video.muted ? " (tap Play / Unmute for audio)" : ""));
  });
  video.addEventListener("error", function () {
    console.warn("HTML video media error", video.error);
    // HLS.js handles fatal errors below; don't recursively reset it here.
  });

  // Google Cast stays separate from player retries.
  window.addEventListener("live-tv-cast-started", function () {
    isCasting = true;
    video.pause();
  });
  window.addEventListener("live-tv-cast-ended", function () {
    isCasting = false;
    report("Cast disconnected. Tap Play / Unmute to watch here.");
  });

  function stopHls() {
    generation++;
    if (hls) {
      const old = hls;
      hls = null;
      old.destroy();
    }
    // Explicitly release any previously failed MSE media source.
    video.pause();
    video.removeAttribute("src");
    video.load();
    manifestReady = false;
    setPlayEnabled(false);
  }

  function scheduleRetry(reason) {
    if (retryTimer !== null) return;
    stopHls();
    report("Stream startup issue (" + reason + "). Retrying in 2 seconds...");
    retryTimer = setTimeout(function () {
      retryTimer = null;
      beginHls();
    }, RETRY_DELAY_MS);
  }

  function beginHls() {
    if (retryTimer !== null) {
      clearTimeout(retryTimer);
      retryTimer = null;
    }
    stopHls();
    const currentGeneration = generation;
    report("Connecting to live video...");

    // Match MediaMTX built-in player rather than custom startup buffer gates.
    const instance = new Hls({ maxLiveSyncPlaybackRate: 1.5 });
    hls = instance;

    instance.on(Hls.Events.ERROR, function (_event, data) {
      if (currentGeneration !== generation) return;
      console.warn("[Live TV] HLS error", data);
      if (data.fatal) scheduleRetry(data.details || "fatal HLS error");
    });
    instance.on(Hls.Events.MEDIA_ATTACHED, function () {
      if (currentGeneration === generation) instance.loadSource(STREAM_URL);
    });
    instance.on(Hls.Events.MANIFEST_LOADED, function () {
      if (currentGeneration !== generation) return;
      manifestReady = true;
      setPlayEnabled(true);
      report("Live stream loaded. Starting video...");
      // Same trigger as MediaMTX's built-in page; muted autoplay is permitted.
      startPlayback();
    });
    // Rejoin live after pausing, as MediaMTX does.
    video.onplay = function () {
      const live = instance.liveSyncPosition;
      if (currentGeneration === generation && Number.isFinite(live)) {
        try { video.currentTime = live; } catch (_) { /* transient live position */ }
      }
    };
    instance.attachMedia(video);
  }

  function loadScript(src, onOK, onFail) {
    const script = document.createElement("script");
    script.src = src;
    script.onload = onOK;
    script.onerror = onFail;
    document.head.appendChild(script);
  }

  function initHls() {
    // Prefer exactly the HLS.js version used by the working MediaMTX page.
    report("Loading MediaMTX HLS playback library...");
    loadScript(BUNDLED_HLS_JS, function () {
      if (window.Hls && Hls.isSupported()) {
        report("MediaMTX HLS.js loaded");
        beginHls();
      } else {
        tryFallback();
      }
    }, tryFallback);
  }

  function tryFallback() {
    report("Loading backup HLS.js...");
    loadScript(FALLBACK_HLS_JS, function () {
      if (window.Hls && Hls.isSupported()) beginHls();
      else if (video.canPlayType("application/vnd.apple.mpegurl")) initNativeHls();
      else report("HLS.js unsupported in this browser");
    }, function () {
      if (video.canPlayType("application/vnd.apple.mpegurl")) initNativeHls();
      else report("Could not load either HLS library");
    });
  }

  function initNativeHls() {
    nativeHls = true;
    setPlayEnabled(true);
    video.src = STREAM_URL;
    video.load();
    report("Native HLS ready. Tap Play / Unmute.");
  }

  setPlayEnabled(false);
  // Like MediaMTX, prefer hls.js over native HLS where MSE is available.
  // On iPhone prefer native HLS for AirPlay and best iOS compatibility.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (isIOS && video.canPlayType("application/vnd.apple.mpegurl")) {
    initNativeHls();
  } else {
    initHls();
  }
})();
</script>

 

<script>

// This callback must exist before the Cast SDK loads.

window.__onGCastApiAvailable = function(available) {

  if (!available) {

    console.log("Google Cast SDK unavailable");

    return;

  }

 

  const context = cast.framework.CastContext.getInstance();

 

  context.setOptions({

    receiverApplicationId:

      chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,

    autoJoinPolicy:

      chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED

  });

 

  async function startCasting() {

    const session = context.getCurrentSession();

    if (!session) return;

 

    const media = new chrome.cast.media.MediaInfo(

      window.liveCastURL,

      "application/x-mpegURL"

    );

 

    media.streamType =

      chrome.cast.media.StreamType.LIVE;

 

    const request =

      new chrome.cast.media.LoadRequest(media);

 

    try {

      await session.loadMedia(request);

      document.getElementById("video").pause();
      window.dispatchEvent(new Event("live-tv-cast-started"));

      window.reportCastError(

        "Live stream sent to Chromecast"

      );

    } catch (error) {

      window.reportCastError(

        "Cast playback failed: " + String(error)

      );

    }

  }

 

  context.addEventListener(

    cast.framework.CastContextEventType.SESSION_STATE_CHANGED,

    function(event) {

      if (event.sessionState ===

          cast.framework.SessionState.SESSION_STARTED) {

        startCasting();

      } else if (event.sessionState ===
          cast.framework.SessionState.SESSION_ENDED) {
        window.dispatchEvent(new Event("live-tv-cast-ended"));
      }

    }

  );

};

</script>

 

<script async
  src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1">
</script>

</body>

</html>
