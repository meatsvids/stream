<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <title>JavaScript Test</title>

</head>

<body>

 

<h2>GitHub Pages JavaScript Test</h2>

 

<p id="status">JavaScript NOT running</p>

 

<button id="testButton">

  Test JavaScript

</button>

 

<script>

  document.getElementById("status").textContent =

    "SUCCESS: JavaScript is running!";

 

  document.getElementById("testButton")

    .addEventListener("click", function() {

      alert("JavaScript button works!");

    });

</script>

 

</body>

</html>
